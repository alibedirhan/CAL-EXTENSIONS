name: Static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin nodejs python3 zip

      - name: Run static checks
        run: bash scripts/check_static.sh

      - name: Test release packaging
        run: bash scripts/package_release.sh ci-check
